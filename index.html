<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Minhas Finanças</title>
  <meta name="theme-color" content="#0f0f13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finanças" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0f0f13; color: #f0f0f0; font-family: 'DM Sans', sans-serif; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input, select, button { font-family: 'DM Sans', sans-serif; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 4px rgba(239,68,68,0.2)} 50%{box-shadow:0 0 0 14px rgba(239,68,68,0.05)} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn 0.25s ease forwards; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0f0f13; }
    ::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 4px; }
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ── CONFIG ───────────────────────────────────────────────────────
const RENDA_PADRAO = 9000;
const ORC = {
  "Moradia":3030,"Carro":1610,"Mercado":500,
  "Restaurante & Delivery":1000,"Lazer & Assinaturas":440,
  "Parcelamentos":457,"Saúde":300,"Outros":500
};
const ICONES = {"Moradia":"🏠","Carro":"🚗","Mercado":"🛒","Restaurante & Delivery":"🍽️","Lazer & Assinaturas":"🎬","Parcelamentos":"💳","Saúde":"❤️","Outros":"📦"};
const CORES  = {"Moradia":"#3b82f6","Carro":"#8b5cf6","Mercado":"#10b981","Restaurante & Delivery":"#f59e0b","Lazer & Assinaturas":"#ec4899","Parcelamentos":"#ef4444","Saúde":"#14b8a6","Outros":"#6b7280"};
const MESES  = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const CATS   = Object.keys(ORC);
const ANTHROPIC_KEY = "SUA_CHAVE_AQUI";

// ── STORAGE ──────────────────────────────────────────────────────
function load(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } }
function save(k, v)   { localStorage.setItem(k, JSON.stringify(v)); }

// ── STATE ────────────────────────────────────────────────────────
const hoje = new Date();
let state = {
  mes: hoje.getMonth(), ano: hoje.getFullYear(),
  aba: "dashboard",
  gastos:  load("fin_gastos", {}),
  rendas:  load("fin_rendas", {}),   // { "2025-3": 9000 }
  modal: false, modalRenda: false,
  gravando: false, processando: false,
  transcricao: "", toast: null, toastTimer: null,
  form: { descricao:"", valor:"", categoria:"Moradia", data: hoje.toISOString().split("T")[0] },
  formRenda: ""
};

function chave() { return `${state.ano}-${state.mes}`; }
function rendaMes() { return state.rendas[chave()] ?? RENDA_PADRAO; }
function gastosMes() { return state.gastos[chave()] || []; }

// ── TOAST ────────────────────────────────────────────────────────
function showToast(msg, dur=2500) {
  clearTimeout(state.toastTimer);
  state.toast = msg; render();
  state.toastTimer = setTimeout(()=>{ state.toast=null; render(); }, dur);
}

// ── VOZ / IA ─────────────────────────────────────────────────────
async function interpretarAudio(texto) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "Content-Type":"application/json","x-api-key":ANTHROPIC_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:300,
      messages:[{role:"user",content:`Extraia as informações do lançamento financeiro falado e retorne SOMENTE JSON válido sem markdown.\nTexto: "${texto}"\nCategorias disponíveis: ${CATS.join(", ")}\nFormato: {"descricao":"...","valor":0.00,"categoria":"..."}\nSe sem valor: {"erro":"não identificado"}`}]
    })
  });
  const d = await res.json();
  return JSON.parse((d.content||[]).map(i=>i.text||"").join("").replace(/```json|```/g,"").trim());
}

let recognition = null;
function iniciarVoz() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast("❌ Navegador não suporta voz"); return; }
  recognition = new SR();
  recognition.lang="pt-BR"; recognition.continuous=false; recognition.interimResults=false;
  recognition.onstart = ()=>{ state.gravando=true; render(); };
  recognition.onresult = async e => {
    const texto = e.results[0][0].transcript;
    state.transcricao=texto; state.gravando=false; state.processando=true; state.modal=true; render();
    try {
      const r = await interpretarAudio(texto);
      if (r.erro) showToast("⚠️ Não identifiquei o valor");
      else { state.form={...state.form,descricao:r.descricao||"",valor:String(r.valor||""),categoria:r.categoria||"Outros"}; showToast("🎙️ Confira e confirme!"); }
    } catch { showToast("⚠️ Erro ao processar áudio"); }
    state.processando=false; render();
  };
  recognition.onerror = ()=>{ state.gravando=false; showToast("❌ Erro na gravação"); render(); };
  recognition.onend   = ()=>{ state.gravando=false; render(); };
  recognition.start();
}
function pararVoz() { recognition?.stop(); state.gravando=false; render(); }

// ── ACTIONS ──────────────────────────────────────────────────────
function navMes(dir) {
  let m=state.mes+dir, a=state.ano;
  if(m<0){m=11;a--;} if(m>11){m=0;a++;}
  state.mes=m; state.ano=a; render();
}
function addGasto() {
  const f=state.form;
  if(!f.descricao||!f.valor||isNaN(parseFloat(f.valor))){ showToast("⚠️ Preencha descrição e valor"); return; }
  const c=chave();
  if(!state.gastos[c]) state.gastos[c]=[];
  state.gastos[c].push({id:Date.now(),...f,valor:parseFloat(f.valor)});
  save("fin_gastos",state.gastos);
  state.form={descricao:"",valor:"",categoria:"Moradia",data:hoje.toISOString().split("T")[0]};
  state.modal=false; state.transcricao="";
  showToast("✅ Lançamento adicionado!");
}
function delGasto(id) {
  const c=chave();
  state.gastos[c]=(state.gastos[c]||[]).filter(g=>g.id!==id);
  save("fin_gastos",state.gastos); render();
}
function salvarRenda() {
  const v=parseFloat(state.formRenda);
  if(isNaN(v)||v<=0){ showToast("⚠️ Valor inválido"); return; }
  state.rendas[chave()]=v;
  save("fin_rendas",state.rendas);
  state.modalRenda=false; state.formRenda="";
  showToast("✅ Renda atualizada!");
}

// ── HELPERS ──────────────────────────────────────────────────────
function brl(v) { return Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2}); }
function el(tag, attrs={}, ...children) {
  const e=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object") Object.assign(e.style,v);
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="class") e.className=v;
    else e.setAttribute(k,v);
  });
  children.flat().forEach(c=>c!=null&&e.append(typeof c==="string"?document.createTextNode(c):c));
  return e;
}
function svg(w,h,content) {
  const s=document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("width",w); s.setAttribute("height",h); s.setAttribute("viewBox",`0 0 ${w} ${h}`);
  s.innerHTML=content; return s;
}

// ── GRÁFICO PIZZA (categoria) ────────────────────────────────────
function graficoPizza(gastosMes) {
  const totais = CATS.map(c=>({ cat:c, v:gastosMes.filter(g=>g.categoria===c).reduce((s,g)=>s+g.valor,0) })).filter(x=>x.v>0);
  if(!totais.length) return el("div",{style:{textAlign:"center",padding:"32px 0",color:"#444"}},"Sem gastos este mês");
  const total=totais.reduce((s,x)=>s+x.v,0);
  const W=260,R=90,cx=130,cy=100;
  let paths="", startAngle=-Math.PI/2;
  totais.forEach(({cat,v})=>{
    const angle=(v/total)*2*Math.PI;
    const x1=cx+R*Math.cos(startAngle), y1=cy+R*Math.sin(startAngle);
    const x2=cx+R*Math.cos(startAngle+angle), y2=cy+R*Math.sin(startAngle+angle);
    const large=angle>Math.PI?1:0;
    paths+=`<path d="M${cx},${cy} L${x1},${y1} A${R},${R} 0 ${large},1 ${x2},${y2} Z" fill="${CORES[cat]}" opacity="0.9"/>`;
    startAngle+=angle;
  });
  // furo central
  paths+=`<circle cx="${cx}" cy="${cy}" r="50" fill="#16161d"/>`;
  paths+=`<text x="${cx}" y="${cy-6}" text-anchor="middle" fill="#f0f0f0" font-size="11" font-family="DM Sans">Total</text>`;
  paths+=`<text x="${cx}" y="${cy+12}" text-anchor="middle" fill="#f0f0f0" font-size="13" font-weight="700" font-family="DM Sans">R$${Math.round(total/1000)}k</text>`;
  const wrap=el("div",{style:{background:"#16161d",borderRadius:"14px",padding:"16px",border:"1px solid #2a2a35",marginBottom:"12px"}});
  wrap.appendChild(el("div",{style:{fontSize:"12px",color:"#666",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"12px"}},"Gastos por categoria"));
  const svgEl=svg(W,200,paths);
  svgEl.style.display="block"; svgEl.style.margin="0 auto";
  wrap.appendChild(svgEl);
  // legenda
  const leg=el("div",{style:{display:"flex",flexWrap:"wrap",gap:"8px",marginTop:"12px"}});
  totais.forEach(({cat,v})=>{
    leg.appendChild(el("div",{style:{display:"flex",alignItems:"center",gap:"6px",fontSize:"11px",color:"#aaa"}},
      el("div",{style:{width:"10px",height:"10px",borderRadius:"3px",background:CORES[cat],flexShrink:"0"}}),
      `${ICONES[cat]} ${cat.split(" ")[0]} (${Math.round(v/total*100)}%)`
    ));
  });
  wrap.appendChild(leg);
  return wrap;
}

// ── GRÁFICO EVOLUÇÃO MENSAL ───────────────────────────────────────
function graficoEvolucao() {
  const ultimos=[];
  for(let i=5;i>=0;i--){
    let m=state.mes-i, a=state.ano;
    if(m<0){m+=12;a--;}
    const c=`${a}-${m}`;
    const g=state.gastos[c]||[];
    const r=state.rendas[c]??RENDA_PADRAO;
    ultimos.push({label:MESES[m].slice(0,3),total:g.reduce((s,x)=>s+x.valor,0),renda:r});
  }
  const maxVal=Math.max(...ultimos.map(x=>Math.max(x.total,x.renda)),1000);
  const W=340,H=140,pad=30,barW=28,gap=(W-pad*2-barW*6)/5;
  let bars="";
  ultimos.forEach(({label,total,renda},i)=>{
    const x=pad+i*(barW+gap);
    const hR=Math.round((renda/maxVal)*(H-20));
    const hG=Math.round((total/maxVal)*(H-20));
    const yR=H-hR, yG=H-hG;
    bars+=`<rect x="${x}" y="${yR}" width="${barW}" height="${hR}" rx="4" fill="#10b98133"/>`;
    bars+=`<rect x="${x}" y="${yG}" width="${barW}" height="${hG}" rx="4" fill="${total>renda?"#ef444499":"#3b82f699"}"/>`;
    bars+=`<text x="${x+barW/2}" y="${H+14}" text-anchor="middle" fill="#666" font-size="10" font-family="DM Sans">${label}</text>`;
  });
  const wrap=el("div",{style:{background:"#16161d",borderRadius:"14px",padding:"16px",border:"1px solid #2a2a35",marginBottom:"12px"}});
  wrap.appendChild(el("div",{style:{fontSize:"12px",color:"#666",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"12px"}},"Evolução mensal (6 meses)"));
  const svgEl=svg(W,H+20,bars);
  svgEl.style.width="100%"; svgEl.style.height="auto";
  wrap.appendChild(svgEl);
  const leg=el("div",{style:{display:"flex",gap:"16px",marginTop:"10px"}});
  [{c:"#10b98133",l:"Renda"},{c:"#3b82f699",l:"Gasto normal"},{c:"#ef444499",l:"Acima da renda"}].forEach(({c,l})=>{
    leg.appendChild(el("div",{style:{display:"flex",alignItems:"center",gap:"6px",fontSize:"11px",color:"#888"}},
      el("div",{style:{width:"10px",height:"10px",borderRadius:"3px",background:c}}), l
    ));
  });
  wrap.appendChild(leg);
  return wrap;
}

// ── COMPARATIVO ORÇAMENTO VS REAL ────────────────────────────────
function graficoComparativo(gastosMes) {
  const wrap=el("div",{style:{background:"#16161d",borderRadius:"14px",padding:"16px",border:"1px solid #2a2a35",marginBottom:"12px"}});
  wrap.appendChild(el("div",{style:{fontSize:"12px",color:"#666",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"14px"}},"Orçamento vs Real"));
  CATS.forEach(cat=>{
    const real=gastosMes.filter(g=>g.categoria===cat).reduce((s,g)=>s+g.valor,0);
    const orc=ORC[cat];
    const pct=Math.min((real/orc)*100,100);
    const over=real>orc;
    const row=el("div",{style:{marginBottom:"12px"}});
    row.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:"4px"}},
      el("span",{style:{fontSize:"12px",display:"flex",alignItems:"center",gap:"5px"}},ICONES[cat]," ",cat),
      el("span",{style:{fontSize:"12px",fontFamily:"DM Mono",color:over?"#ef4444":"#f0f0f0"}},
        `R$${brl(real)} / R$${orc.toLocaleString("pt-BR")}`
      )
    ));
    const track=el("div",{style:{background:"#2a2a35",borderRadius:"99px",height:"6px",position:"relative"}});
    track.appendChild(el("div",{style:{width:`${pct}%`,height:"100%",borderRadius:"99px",background:over?"#ef4444":pct>80?"#f59e0b":CORES[cat],transition:"width 0.4s"}}));
    row.appendChild(track);
    if(over) row.appendChild(el("div",{style:{fontSize:"10px",color:"#ef4444",marginTop:"3px",textAlign:"right"}},`⚠️ R$${brl(real-orc)} acima do orçamento`));
    wrap.appendChild(row);
  });
  return wrap;
}

// ── RENDER ───────────────────────────────────────────────────────
function render() {
  const gm=gastosMes(), renda=rendaMes();
  const totalGasto=gm.reduce((s,g)=>s+g.valor,0);
  const saldo=renda-totalGasto;
  const pct=Math.min((totalGasto/renda)*100,100);
  const corBarra=pct>90?"#ef4444":pct>70?"#f59e0b":"#10b981";

  const inp={width:"100%",background:"#0f0f13",border:"1px solid #2a2a35",borderRadius:"12px",padding:"12px 14px",color:"#f0f0f0",fontSize:"14px"};
  const lbl={fontSize:"11px",color:"#666",display:"block",marginBottom:"6px",letterSpacing:"1px",textTransform:"uppercase"};
  const btnPrimary={width:"100%",padding:"14px",borderRadius:"14px",border:"none",background:"linear-gradient(135deg,#3b82f6,#6366f1)",color:"#fff",fontWeight:"700",fontSize:"15px",cursor:"pointer"};

  const abas = ["dashboard","graficos","lancamentos"];
  const abaLabels = ["📊 Resumo","📈 Gráficos","📋 Gastos"];

  const root=el("div",{style:{minHeight:"100vh",background:"#0f0f13",paddingBottom:"100px"}},

    // HEADER
    el("div",{style:{background:"#16161d",borderBottom:"1px solid #2a2a35",padding:"16px 20px",position:"sticky",top:"0",zIndex:"10"}},
      el("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",maxWidth:"480px",margin:"0 auto"}},
        el("div",{},
          el("div",{style:{fontSize:"10px",color:"#555",letterSpacing:"2px",textTransform:"uppercase"}},"Controle Financeiro"),
          el("div",{style:{fontSize:"18px",fontWeight:"700",marginTop:"2px"}},"Minhas Finanças")
        ),
        el("div",{style:{display:"flex",alignItems:"center",gap:"8px"}},
          el("button",{style:{background:"#2a2a35",border:"none",color:"#aaa",borderRadius:"8px",width:"32px",height:"32px",cursor:"pointer",fontSize:"16px"},onClick:()=>navMes(-1)},"‹"),
          el("span",{style:{fontSize:"13px",fontWeight:"600",minWidth:"92px",textAlign:"center"}},`${MESES[state.mes].slice(0,3)} ${state.ano}`),
          el("button",{style:{background:"#2a2a35",border:"none",color:"#aaa",borderRadius:"8px",width:"32px",height:"32px",cursor:"pointer",fontSize:"16px"}},onClick:()=>navMes(1),"›")
        )
      )
    ),

    el("div",{style:{maxWidth:"480px",margin:"0 auto",padding:"0 16px"}},

      // CARDS TOPO
      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px",marginTop:"20px"}},
        // Renda editável
        el("div",{style:{background:"#16161d",borderRadius:"16px",padding:"16px",border:"1px solid #2a2a35",cursor:"pointer",position:"relative"},
          onClick:()=>{ state.modalRenda=true; state.formRenda=String(renda); render(); }},
          el("div",{style:{fontSize:"10px",color:"#555",letterSpacing:"1px",textTransform:"uppercase"}},"Renda ✏️"),
          el("div",{style:{fontSize:"22px",fontWeight:"700",marginTop:"4px",color:"#10b981"}},`R$ ${renda.toLocaleString("pt-BR")}`)
        ),
        el("div",{style:{background:"#16161d",borderRadius:"16px",padding:"16px",border:"1px solid #2a2a35"}},
          el("div",{style:{fontSize:"10px",color:"#555",letterSpacing:"1px",textTransform:"uppercase"}},"Gasto"),
          el("div",{style:{fontSize:"22px",fontWeight:"700",marginTop:"4px",color:"#f59e0b"}},`R$ ${brl(totalGasto)}`)
        )
      ),

      // SALDO
      el("div",{style:{background:"#16161d",borderRadius:"16px",padding:"20px",border:`1px solid ${saldo>=0?"#1a3a2a":"#3a1a1a"}`,marginTop:"12px"}},
        el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}},
          el("div",{style:{fontSize:"10px",color:"#555",letterSpacing:"1px",textTransform:"uppercase"}},"Saldo do mês"),
          el("div",{style:{fontSize:"20px",fontWeight:"700",color:saldo>=0?"#10b981":"#ef4444"}},
            `${saldo>=0?"+":""}R$ ${brl(Math.abs(saldo))}`)
        ),
        el("div",{style:{background:"#2a2a35",borderRadius:"99px",height:"8px",overflow:"hidden"}},
          el("div",{style:{width:`${pct}%`,height:"100%",background:corBarra,borderRadius:"99px",transition:"width 0.5s"}})
        ),
        el("div",{style:{fontSize:"11px",color:"#555",marginTop:"6px",textAlign:"right"}},`${pct.toFixed(0)}% da renda utilizada`)
      ),

      // ABAS
      el("div",{style:{display:"flex",background:"#16161d",borderRadius:"12px",padding:"4px",marginTop:"20px",gap:"4px",border:"1px solid #2a2a35"}},
        ...abas.map((id,i)=>
          el("button",{style:{flex:"1",padding:"10px",borderRadius:"10px",border:"none",cursor:"pointer",
            background:state.aba===id?"#3b82f6":"transparent",
            color:state.aba===id?"#fff":"#888",fontWeight:"600",fontSize:"12px",transition:"all 0.2s"},
            onClick:()=>{ state.aba=id; render(); }}, abaLabels[i])
        )
      ),

      // ── ABA DASHBOARD ──
      ...(state.aba==="dashboard"?[
        el("div",{style:{marginTop:"16px"}},
          ...CATS.map(cat=>{
            const total=gm.filter(g=>g.categoria===cat).reduce((s,g)=>s+g.valor,0);
            const orc=ORC[cat], p=Math.min((total/orc)*100,100);
            return el("div",{style:{background:"#16161d",borderRadius:"14px",padding:"14px 16px",marginBottom:"10px",border:"1px solid #2a2a35"}},
              el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}},
                el("div",{style:{display:"flex",alignItems:"center",gap:"8px"}},
                  el("span",{style:{fontSize:"18px"}},ICONES[cat]),
                  el("span",{style:{fontSize:"13px",fontWeight:"600"}},cat)
                ),
                el("div",{},
                  el("span",{style:{fontSize:"14px",fontWeight:"700",color:p>90?"#ef4444":"#f0f0f0"}},`R$ ${brl(total)}`),
                  el("span",{style:{fontSize:"11px",color:"#555",marginLeft:"4px"}},`/ ${orc.toLocaleString("pt-BR")}`)
                )
              ),
              el("div",{style:{background:"#2a2a35",borderRadius:"99px",height:"6px"}},
                el("div",{style:{width:`${p}%`,height:"100%",borderRadius:"99px",background:p>100?"#ef4444":p>80?"#f59e0b":CORES[cat],transition:"width 0.4s"}})
              )
            );
          })
        )
      ]:[]),

      // ── ABA GRÁFICOS ──
      ...(state.aba==="graficos"?[
        el("div",{style:{marginTop:"16px"}},
          graficoPizza(gm),
          graficoEvolucao(),
          graficoComparativo(gm)
        )
      ]:[]),

      // ── ABA LANÇAMENTOS ──
      ...(state.aba==="lancamentos"?[
        el("div",{style:{marginTop:"16px"}},
          ...(gm.length===0?[
            el("div",{style:{textAlign:"center",padding:"48px 20px",color:"#444"}},
              el("div",{style:{fontSize:"44px",marginBottom:"12px"}},"💸"),
              el("div",{style:{fontSize:"15px",fontWeight:"600"}},"Nenhum lançamento ainda"),
              el("div",{style:{fontSize:"13px",marginTop:"6px",color:"#555"}},"Toque em 🎙️ ou + para adicionar")
            )
          ]:[...gm].sort((a,b)=>b.data.localeCompare(a.data)).map(g=>
            el("div",{class:"fade-in",style:{background:"#16161d",borderRadius:"14px",padding:"14px 16px",marginBottom:"10px",border:"1px solid #2a2a35",display:"flex",justifyContent:"space-between",alignItems:"center"}},
              el("div",{style:{display:"flex",gap:"12px",alignItems:"center"}},
                el("div",{style:{width:"40px",height:"40px",borderRadius:"12px",background:CORES[g.categoria]+"22",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"20px",flexShrink:"0"}},ICONES[g.categoria]),
                el("div",{},
                  el("div",{style:{fontSize:"14px",fontWeight:"600"}},g.descricao),
                  el("div",{style:{fontSize:"11px",color:"#555",marginTop:"2px"}},`${g.data.split("-").reverse().join("/")} · ${g.categoria}`)
                )
              ),
              el("div",{style:{display:"flex",alignItems:"center",gap:"10px",flexShrink:"0"}},
                el("div",{style:{fontSize:"15px",fontWeight:"700",color:"#ef4444"}},`-R$ ${brl(g.valor)}`),
                el("button",{style:{background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:"22px",lineHeight:"1",padding:"0 4px"},onClick:()=>delGasto(g.id)},"×")
              )
            )
          ))
        )
      ]:[])
    ),

    // BOTÕES FLUTUANTES
    el("div",{style:{position:"fixed",bottom:"24px",right:"20px",display:"flex",flexDirection:"column",gap:"12px"}},
      el("button",{
        style:{width:"54px",height:"54px",borderRadius:"999px",border:"none",
          background:state.gravando?"linear-gradient(135deg,#ef4444,#dc2626)":"linear-gradient(135deg,#10b981,#059669)",
          color:"#fff",fontSize:"22px",cursor:"pointer",
          boxShadow:state.gravando?"0 4px 20px rgba(239,68,68,0.4)":"0 4px 20px rgba(16,185,129,0.4)",
          display:"flex",alignItems:"center",justifyContent:"center",
          animation:state.gravando?"pulse 1.2s infinite":"none",transition:"background 0.3s"},
        onClick:state.gravando?pararVoz:iniciarVoz
      },state.gravando?"⏹":"🎙️"),
      el("button",{
        style:{width:"54px",height:"54px",borderRadius:"999px",border:"none",background:"linear-gradient(135deg,#3b82f6,#6366f1)",color:"#fff",fontSize:"24px",cursor:"pointer",boxShadow:"0 4px 24px rgba(59,130,246,0.45)",display:"flex",alignItems:"center",justifyContent:"center"},
        onClick:()=>{ state.transcricao=""; state.modal=true; render(); }
      },"+")
    ),

    // TOAST
    ...(state.toast||state.gravando||state.processando?[
      el("div",{style:{position:"fixed",bottom:"92px",left:"50%",transform:"translateX(-50%)",
        background:state.gravando?"#ef4444":state.processando?"#6366f1":"#1e1e2e",
        color:"#fff",padding:"10px 22px",borderRadius:"99px",fontSize:"13px",fontWeight:"600",
        boxShadow:"0 4px 24px rgba(0,0,0,0.5)",whiteSpace:"nowrap",zIndex:"200",
        border:state.gravando||state.processando?"none":"1px solid #2a2a35"}},
        state.gravando?"🔴 Gravando... fale o gasto":state.processando?"✨ Interpretando áudio...":state.toast)
    ]:[]),

    // MODAL RENDA
    ...(state.modalRenda?[
      el("div",{style:{position:"fixed",inset:"0",background:"rgba(0,0,0,0.75)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:"100"},
        onClick:()=>{ state.modalRenda=false; render(); }},
        el("div",{style:{background:"#16161d",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:"480px",border:"1px solid #2a2a35",borderBottom:"none"},
          onClick:e=>e.stopPropagation()},
          el("div",{style:{fontSize:"17px",fontWeight:"700",marginBottom:"6px"}},"Editar renda"),
          el("div",{style:{fontSize:"12px",color:"#555",marginBottom:"20px"}},`Renda atual de ${MESES[state.mes]}: R$ ${rendaMes().toLocaleString("pt-BR")}`),
          el("div",{style:{marginBottom:"22px"}},
            el("label",{style:lbl},"Nova renda (R$)"),
            (() => {
              const i=el("input",{style:inp,type:"number",placeholder:"9000",value:state.formRenda});
              i.addEventListener("input",e=>{ state.formRenda=e.target.value; });
              return i;
            })()
          ),
          el("button",{style:btnPrimary,onClick:salvarRenda},"Salvar renda")
        )
      )
    ]:[]),

    // MODAL GASTO
    ...(state.modal?[
      el("div",{style:{position:"fixed",inset:"0",background:"rgba(0,0,0,0.75)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:"100"},
        onClick:()=>{ state.modal=false; render(); }},
        el("div",{style:{background:"#16161d",borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:"480px",border:"1px solid #2a2a35",borderBottom:"none"},
          onClick:e=>e.stopPropagation()},
          el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"20px"}},
            el("div",{style:{fontSize:"17px",fontWeight:"700"}},"Novo lançamento"),
            state.transcricao?el("div",{style:{fontSize:"11px",color:"#555",maxWidth:"180px",textAlign:"right",lineHeight:"1.4"}},`🎙️ "${state.transcricao}"`):null
          ),
          ...(state.processando?[
            el("div",{style:{textAlign:"center",padding:"40px 0"}},
              el("div",{style:{fontSize:"36px",marginBottom:"12px"}},"✨"),
              el("div",{style:{fontWeight:"600",color:"#6366f1"}},"Interpretando áudio...")
            )
          ]:[
            el("div",{style:{marginBottom:"14px"}},
              el("label",{style:lbl},"Descrição"),
              (() => { const i=el("input",{style:inp,placeholder:"Ex: Almoço no restaurante",value:state.form.descricao}); i.addEventListener("input",e=>{ state.form.descricao=e.target.value; }); return i; })()
            ),
            el("div",{style:{marginBottom:"14px"}},
              el("label",{style:lbl},"Valor (R$)"),
              (() => { const i=el("input",{style:inp,type:"number",placeholder:"0.00",value:state.form.valor}); i.addEventListener("input",e=>{ state.form.valor=e.target.value; }); return i; })()
            ),
            el("div",{style:{marginBottom:"14px"}},
              el("label",{style:lbl},"Categoria"),
              (() => { const s=el("select",{style:inp},...CATS.map(c=>el("option",{value:c},`${ICONES[c]} ${c}`))); s.value=state.form.categoria; s.addEventListener("change",e=>{ state.form.categoria=e.target.value; }); return s; })()
            ),
            el("div",{style:{marginBottom:"22px"}},
              el("label",{style:lbl},"Data"),
              (() => { const i=el("input",{style:inp,type:"date",value:state.form.data}); i.addEventListener("input",e=>{ state.form.data=e.target.value; }); return i; })()
            ),
            el("button",{style:btnPrimary,onClick:addGasto},"Confirmar lançamento")
          ])
        )
      )
    ]:[])
  );

  const app=document.getElementById("app");
  app.innerHTML="";
  app.appendChild(root);
}

render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
