<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Minhas Finanças</title>
  <meta name="theme-color" content="#0f0f13"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Finanças"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f0f13;color:#f0f0f0;font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:100px}
    input,select,button{font-family:'DM Sans',sans-serif}
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    .card{background:#16161d;border-radius:14px;border:1px solid #2a2a35;padding:16px;margin-bottom:12px}
    .btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
    .inp{width:100%;background:#0f0f13;border:1px solid #2a2a35;border-radius:10px;padding:12px;color:#f0f0f0;font-size:14px}
    .lbl{font-size:11px;color:#666;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
    .fab{width:54px;height:54px;border-radius:50%;border:none;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:fixed;right:20px}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;z-index:100}
    .sheet{background:#16161d;border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;max-width:480px;border:1px solid #2a2a35;border-bottom:none}
    .tab{flex:1;padding:10px;border-radius:10px;border:none;cursor:pointer;font-weight:600;font-size:12px;transition:all .2s}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(239,68,68,.2)}50%{box-shadow:0 0 0 12px rgba(239,68,68,.05)}}
  </style>
</head>
<body>

<div id="root"></div>

<script>
// ─── CONSTANTES ───────────────────────────────────────────
const CATS = ["Moradia","Carro","Mercado","Restaurante & Delivery","Lazer & Assinaturas","Parcelamentos","Saúde","Outros"];
const ORC  = {Moradia:3030,Carro:1610,Mercado:500,"Restaurante & Delivery":1000,"Lazer & Assinaturas":440,Parcelamentos:457,"Saúde":300,Outros:500};
const ICO  = {Moradia:"🏠",Carro:"🚗",Mercado:"🛒","Restaurante & Delivery":"🍽️","Lazer & Assinaturas":"🎬",Parcelamentos:"💳","Saúde":"❤️",Outros:"📦"};
const COR  = {Moradia:"#3b82f6",Carro:"#8b5cf6",Mercado:"#10b981","Restaurante & Delivery":"#f59e0b","Lazer & Assinaturas":"#ec4899",Parcelamentos:"#ef4444","Saúde":"#14b8a6",Outros:"#6b7280"};
const MESES= ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const ANTHROPIC_KEY = "SUA_CHAVE_AQUI";

// ─── ESTADO ───────────────────────────────────────────────
const hoje = new Date();
let S = {
  mes: hoje.getMonth(),
  ano: hoje.getFullYear(),
  aba: "resumo",
  gastos:  load("fin_g",{}),
  rendas:  load("fin_r",{}),
  modal:   null, // null | "gasto" | "renda"
  gravando: false,
  processando: false,
  transcricao: "",
  toast: null,
  _toastT: null,
  form: { descricao:"", valor:"", categoria:"Moradia", data:hoje.toISOString().slice(0,10) },
  formRenda: ""
};

function load(k,d){ try{ return JSON.parse(localStorage.getItem(k))??d }catch{ return d } }
function save(k,v){ localStorage.setItem(k,JSON.stringify(v)) }
function chave(){ return S.ano+"-"+S.mes }
function renda(){ return S.rendas[chave()]??9000 }
function gm(){ return S.gastos[chave()]||[] }
function brl(v){ return Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2}) }

function toast(msg,ms=2500){
  clearTimeout(S._toastT);
  S.toast=msg; draw();
  S._toastT=setTimeout(()=>{ S.toast=null; draw(); },ms);
}

// ─── VOZ ──────────────────────────────────────────────────
let rec=null;
function iniciarVoz(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast("❌ Voz não suportada neste navegador"); return; }
  rec=new SR();
  rec.lang="pt-BR"; rec.continuous=false; rec.interimResults=false;
  rec.onstart=()=>{ S.gravando=true; draw(); };
  rec.onresult=async e=>{
    const txt=e.results[0][0].transcript;
    S.transcricao=txt; S.gravando=false; S.processando=true; S.modal="gasto"; draw();
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":ANTHROPIC_KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:200,
          messages:[{role:"user",content:`Texto: "${txt}". Categorias: ${CATS.join(",")}. Retorne APENAS JSON: {"descricao":"...","valor":0.00,"categoria":"..."} ou {"erro":"sim"} se sem valor.`}]})
      });
      const d=await res.json();
      const r=JSON.parse((d.content||[]).map(i=>i.text||"").join("").replace(/```json|```/g,"").trim());
      if(r.erro) toast("⚠️ Não identifiquei o valor, preencha manualmente");
      else{ S.form={...S.form,descricao:r.descricao||"",valor:String(r.valor||""),categoria:r.categoria||"Outros"}; toast("🎙️ Confira e confirme!"); }
    }catch{ toast("⚠️ Erro ao processar — preencha manualmente"); }
    S.processando=false; draw();
  };
  rec.onerror=()=>{ S.gravando=false; toast("❌ Erro na gravação"); draw(); };
  rec.onend=()=>{ S.gravando=false; draw(); };
  rec.start();
}
function pararVoz(){ rec?.stop(); S.gravando=false; draw(); }

// ─── AÇÕES ────────────────────────────────────────────────
function navMes(d){
  let m=S.mes+d,a=S.ano;
  if(m<0){m=11;a--;} if(m>11){m=0;a++;}
  S.mes=m;S.ano=a;draw();
}

function addGasto(){
  const f=S.form;
  if(!f.descricao||!f.valor||isNaN(+f.valor)){ toast("⚠️ Preencha descrição e valor"); return; }
  const c=chave();
  if(!S.gastos[c]) S.gastos[c]=[];
  S.gastos[c].push({id:Date.now(),descricao:f.descricao,valor:+f.valor,categoria:f.categoria,data:f.data});
  save("fin_g",S.gastos);
  S.form={descricao:"",valor:"",categoria:"Moradia",data:hoje.toISOString().slice(0,10)};
  S.modal=null; S.transcricao="";
  toast("✅ Lançamento adicionado!");
}

function delGasto(id){
  const c=chave();
  S.gastos[c]=(S.gastos[c]||[]).filter(g=>g.id!==id);
  save("fin_g",S.gastos); draw();
}

function salvarRenda(){
  const v=+S.formRenda;
  if(!v||v<=0){ toast("⚠️ Valor inválido"); return; }
  S.rendas[chave()]=v; save("fin_r",S.rendas);
  S.modal=null; S.formRenda=""; toast("✅ Renda atualizada!");
}

// ─── RENDER ───────────────────────────────────────────────
function draw(){
  const gastos=gm(), r=renda();
  const total=gastos.reduce((s,g)=>s+g.valor,0);
  const saldo=r-total;
  const pct=Math.min(total/r*100,100);
  const corB=pct>90?"#ef4444":pct>70?"#f59e0b":"#10b981";

  let html=`
  <!-- HEADER -->
  <div style="background:#16161d;border-bottom:1px solid #2a2a35;padding:16px 20px;position:sticky;top:0;z-index:10">
    <div style="max-width:480px;margin:0 auto;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:10px;color:#555;letter-spacing:2px;text-transform:uppercase">Controle Financeiro</div>
        <div style="font-size:18px;font-weight:700;margin-top:2px">Minhas Finanças</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button onclick="navMes(-1)" style="background:#2a2a35;border:none;color:#aaa;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center">‹</button>
        <span style="font-size:13px;font-weight:600;min-width:90px;text-align:center">${MESES[S.mes].slice(0,3)} ${S.ano}</span>
        <button onclick="navMes(1)" style="background:#2a2a35;border:none;color:#aaa;border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center">›</button>
      </div>
    </div>
  </div>

  <div style="max-width:480px;margin:0 auto;padding:0 16px">

    <!-- CARDS TOPO -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px">
      <div class="card" onclick="abrirRenda()" style="cursor:pointer">
        <div class="lbl">Renda ✏️</div>
        <div style="font-size:22px;font-weight:700;color:#10b981;margin-top:4px">R$ ${r.toLocaleString("pt-BR")}</div>
      </div>
      <div class="card">
        <div class="lbl">Gasto</div>
        <div style="font-size:22px;font-weight:700;color:#f59e0b;margin-top:4px">R$ ${brl(total)}</div>
      </div>
    </div>

    <!-- SALDO -->
    <div class="card" style="border-color:${saldo>=0?"#1a3a2a":"#3a1a1a"}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="lbl" style="margin:0">Saldo do mês</div>
        <div style="font-size:20px;font-weight:700;color:${saldo>=0?"#10b981":"#ef4444"}">${saldo>=0?"+":""}R$ ${brl(Math.abs(saldo))}</div>
      </div>
      <div style="background:#2a2a35;border-radius:99px;height:8px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${corB};border-radius:99px;transition:width .5s"></div>
      </div>
      <div style="font-size:11px;color:#555;margin-top:6px;text-align:right">${pct.toFixed(0)}% da renda utilizada</div>
    </div>

    <!-- ABAS -->
    <div style="display:flex;background:#16161d;border-radius:12px;padding:4px;gap:4px;border:1px solid #2a2a35;margin-bottom:16px">
      ${["resumo","graficos","gastos"].map((id,i)=>`
        <button class="tab" onclick="setAba('${id}')" style="background:${S.aba===id?"#3b82f6":"transparent"};color:${S.aba===id?"#fff":"#888"}">
          ${["📊 Resumo","📈 Gráficos","📋 Gastos"][i]}
        </button>`).join("")}
    </div>`;

  // ── ABA RESUMO ──
  if(S.aba==="resumo"){
    html+=CATS.map(cat=>{
      const t=gastos.filter(g=>g.categoria===cat).reduce((s,g)=>s+g.valor,0);
      const o=ORC[cat], p=Math.min(t/o*100,100);
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:18px">${ICO[cat]}</span>
            <span style="font-size:13px;font-weight:600">${cat}</span>
          </div>
          <div>
            <span style="font-size:14px;font-weight:700;color:${p>90?"#ef4444":"#f0f0f0"}">R$ ${brl(t)}</span>
            <span style="font-size:11px;color:#555;margin-left:4px">/ ${o.toLocaleString("pt-BR")}</span>
          </div>
        </div>
        <div style="background:#2a2a35;border-radius:99px;height:6px">
          <div style="width:${p}%;height:100%;border-radius:99px;background:${p>100?"#ef4444":p>80?"#f59e0b":COR[cat]};transition:width .4s"></div>
        </div>
      </div>`;
    }).join("");
  }

  // ── ABA GRÁFICOS ──
  if(S.aba==="graficos"){
    // Pizza
    const totCats=CATS.map(c=>({c,v:gastos.filter(g=>g.categoria===c).reduce((s,g)=>s+g.valor,0)})).filter(x=>x.v>0);
    const totG=totCats.reduce((s,x)=>s+x.v,0)||1;
    let paths="",ang=-Math.PI/2;
    totCats.forEach(({c,v})=>{
      const a=v/totG*2*Math.PI,r=80,cx=110,cy=90;
      const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang);
      const x2=cx+r*Math.cos(ang+a),y2=cy+r*Math.sin(ang+a);
      paths+=`<path d="M${cx},${cy}L${x1},${y1}A${r},${r} 0 ${a>Math.PI?1:0},1 ${x2},${y2}Z" fill="${COR[c]}" opacity=".9"/>`;
      ang+=a;
    });
    paths+=`<circle cx="110" cy="90" r="46" fill="#16161d"/>
      <text x="110" y="86" text-anchor="middle" fill="#aaa" font-size="10" font-family="DM Sans">Total</text>
      <text x="110" y="102" text-anchor="middle" fill="#f0f0f0" font-size="13" font-weight="700" font-family="DM Sans">R$ ${brl(total)}</text>`;

    // Evolução
    const ultimos=[];
    for(let i=5;i>=0;i--){
      let m=S.mes-i,a=S.ano;
      if(m<0){m+=12;a--;}
      const gs=S.gastos[a+"-"+m]||[];
      const re=S.rendas[a+"-"+m]??9000;
      ultimos.push({l:MESES[m].slice(0,3),t:gs.reduce((s,g)=>s+g.valor,0),r:re});
    }
    const maxV=Math.max(...ultimos.map(x=>Math.max(x.t,x.r)),1000);
    const W=300,H=100,pad=10,bW=30,gap=(W-pad*2-bW*6)/5;
    let bars="";
    ultimos.forEach(({l,t,r},i)=>{
      const x=pad+i*(bW+gap);
      const hR=Math.round(r/maxV*(H-10));
      const hT=Math.round(t/maxV*(H-10));
      bars+=`<rect x="${x}" y="${H-hR}" width="${bW}" height="${hR}" rx="3" fill="#10b98130"/>
        <rect x="${x}" y="${H-hT}" width="${bW}" height="${hT}" rx="3" fill="${t>r?"#ef444480":"#3b82f680"}"/>
        <text x="${x+bW/2}" y="${H+14}" text-anchor="middle" fill="#666" font-size="9" font-family="DM Sans">${l}</text>`;
    });

    html+=`
    <div class="card">
      <div class="lbl">Gastos por categoria</div>
      ${totCats.length?`
      <svg width="220" height="180" viewBox="0 0 220 180" style="display:block;margin:0 auto">
        ${paths}
      </svg>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
        ${totCats.map(({c,v})=>`
          <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#aaa">
            <div style="width:9px;height:9px;border-radius:3px;background:${COR[c]}"></div>
            ${ICO[c]} ${c.split(" ")[0]} ${Math.round(v/totG*100)}%
          </div>`).join("")}
      </div>`:"<div style='text-align:center;color:#444;padding:20px'>Sem gastos este mês</div>"}
    </div>

    <div class="card">
      <div class="lbl">Evolução 6 meses</div>
      <svg width="100%" height="120" viewBox="0 0 ${W} ${H+20}" preserveAspectRatio="xMidYMid meet">
        ${bars}
      </svg>
      <div style="display:flex;gap:12px;margin-top:8px">
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#888">
          <div style="width:9px;height:9px;border-radius:3px;background:#10b98130"></div>Renda
        </div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#888">
          <div style="width:9px;height:9px;border-radius:3px;background:#3b82f680"></div>Gasto ok
        </div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#888">
          <div style="width:9px;height:9px;border-radius:3px;background:#ef444480"></div>Acima
        </div>
      </div>
    </div>

    <div class="card">
      <div class="lbl" style="margin-bottom:14px">Orçamento vs Real</div>
      ${CATS.map(cat=>{
        const t=gastos.filter(g=>g.categoria===cat).reduce((s,g)=>s+g.valor,0);
        const o=ORC[cat], p=Math.min(t/o*100,100), over=t>o;
        return `<div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span style="font-size:12px">${ICO[cat]} ${cat}</span>
            <span style="font-size:11px;color:${over?"#ef4444":"#aaa"}">R$${brl(t)} / R$${o.toLocaleString("pt-BR")}</span>
          </div>
          <div style="background:#2a2a35;border-radius:99px;height:5px">
            <div style="width:${p}%;height:100%;border-radius:99px;background:${over?"#ef4444":p>80?"#f59e0b":COR[cat]}"></div>
          </div>
          ${over?`<div style="font-size:10px;color:#ef4444;margin-top:2px;text-align:right">⚠️ +R$${brl(t-o)} acima</div>`:""}
        </div>`;
      }).join("")}
    </div>`;
  }

  // ── ABA GASTOS ──
  if(S.aba==="gastos"){
    const sorted=[...gastos].sort((a,b)=>b.data.localeCompare(a.data));
    html+=sorted.length?sorted.map(g=>`
      <div class="card" style="display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;gap:12px;align-items:center">
          <div style="width:40px;height:40px;border-radius:12px;background:${COR[g.categoria]}22;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${ICO[g.categoria]}</div>
          <div>
            <div style="font-size:14px;font-weight:600">${g.descricao}</div>
            <div style="font-size:11px;color:#555;margin-top:2px">${g.data.split("-").reverse().join("/")} · ${g.categoria}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
          <div style="font-size:15px;font-weight:700;color:#ef4444">-R$ ${brl(g.valor)}</div>
          <button onclick="delGasto(${g.id})" style="background:none;border:none;color:#555;cursor:pointer;font-size:22px;line-height:1;padding:0 4px">×</button>
        </div>
      </div>`).join("")
    :`<div style="text-align:center;padding:48px 20px;color:#444">
        <div style="font-size:44px;margin-bottom:12px">💸</div>
        <div style="font-size:15px;font-weight:600">Nenhum lançamento</div>
        <div style="font-size:13px;margin-top:6px;color:#555">Toque em 🎙️ ou + para adicionar</div>
      </div>`;
  }

  html+=`</div>

  <!-- BOTÕES FLUTUANTES -->
  <button class="fab" style="bottom:90px;background:${S.gravando?"linear-gradient(135deg,#ef4444,#dc2626)":"linear-gradient(135deg,#10b981,#059669)"};box-shadow:0 4px 20px ${S.gravando?"rgba(239,68,68,.4)":"rgba(16,185,129,.4)"};animation:${S.gravando?"pulse 1.2s infinite":"none"}"
    onclick="${S.gravando?"pararVoz()":"iniciarVoz()"}">
    ${S.gravando?"⏹":"🎙️"}
  </button>
  <button class="fab" style="bottom:28px;background:linear-gradient(135deg,#3b82f6,#6366f1);box-shadow:0 4px 24px rgba(59,130,246,.45)"
    onclick="abrirGasto()">+</button>`;

  // TOAST
  if(S.toast||S.gravando||S.processando){
    const bg=S.gravando?"#ef4444":S.processando?"#6366f1":"#1e1e2e";
    const msg=S.gravando?"🔴 Gravando... fale o gasto":S.processando?"✨ Interpretando áudio...":S.toast;
    html+=`<div style="position:fixed;bottom:155px;left:50%;transform:translateX(-50%);background:${bg};color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.5)">${msg}</div>`;
  }

  // MODAL RENDA
  if(S.modal==="renda"){
    html+=`<div class="overlay" onclick="fecharModal()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div style="font-size:17px;font-weight:700;margin-bottom:6px">Editar renda</div>
        <div style="font-size:12px;color:#555;margin-bottom:20px">Renda atual: R$ ${renda().toLocaleString("pt-BR")}</div>
        <div style="margin-bottom:22px">
          <label class="lbl">Nova renda (R$)</label>
          <input class="inp" type="number" placeholder="9000" value="${S.formRenda}" oninput="S.formRenda=this.value"/>
        </div>
        <button class="btn" onclick="salvarRenda()">Salvar renda</button>
      </div>
    </div>`;
  }

  // MODAL GASTO
  if(S.modal==="gasto"){
    html+=`<div class="overlay" onclick="fecharModal()">
      <div class="sheet" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px">
          <div style="font-size:17px;font-weight:700">Novo lançamento</div>
          ${S.transcricao?`<div style="font-size:11px;color:#555;max-width:180px;text-align:right">🎙️ "${S.transcricao}"</div>`:""}
        </div>
        ${S.processando?`<div style="text-align:center;padding:40px 0">
          <div style="font-size:36px;margin-bottom:12px">✨</div>
          <div style="font-weight:600;color:#6366f1">Interpretando áudio...</div>
        </div>`:`
        <div style="margin-bottom:14px">
          <label class="lbl">Descrição</label>
          <input class="inp" placeholder="Ex: Almoço no restaurante" value="${S.form.descricao}" oninput="S.form.descricao=this.value"/>
        </div>
        <div style="margin-bottom:14px">
          <label class="lbl">Valor (R$)</label>
          <input class="inp" type="number" placeholder="0.00" value="${S.form.valor}" oninput="S.form.valor=this.value"/>
        </div>
        <div style="margin-bottom:14px">
          <label class="lbl">Categoria</label>
          <select class="inp" onchange="S.form.categoria=this.value">
            ${CATS.map(c=>`<option value="${c}" ${S.form.categoria===c?"selected":""}>${ICO[c]} ${c}</option>`).join("")}
          </select>
        </div>
        <div style="margin-bottom:22px">
          <label class="lbl">Data</label>
          <input class="inp" type="date" value="${S.form.data}" oninput="S.form.data=this.value"/>
        </div>
        <button class="btn" onclick="addGasto()">Confirmar lançamento</button>`}
      </div>
    </div>`;
  }

  document.getElementById("root").innerHTML=html;
}

// ── FUNÇÕES GLOBAIS (chamadas pelo HTML) ──────────────────
window.navMes=navMes;
window.setAba=id=>{ S.aba=id; draw(); };
window.abrirGasto=()=>{ S.transcricao=""; S.modal="gasto"; draw(); };
window.abrirRenda=()=>{ S.formRenda=String(renda()); S.modal="renda"; draw(); };
window.fecharModal=()=>{ S.modal=null; draw(); };
window.addGasto=addGasto;
window.delGasto=delGasto;
window.salvarRenda=salvarRenda;
window.iniciarVoz=iniciarVoz;
window.pararVoz=pararVoz;

draw();

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
